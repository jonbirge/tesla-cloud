server {
    listen 8080;
    server_name _;
    
    root /var/www/html;
    index index.html index.htm;
    
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Handle static files
    location / {
        try_files $uri $uri/ =404;
    }
    
    # Handle PHP files
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_index index.php;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
    
    # Media and fonts change only by being replaced, so they can be held a long
    # time. CSS and JS are edited in place at the same paths (there is no build
    # step producing content-hashed filenames), so "immutable" would pin stale
    # copies for a year and no edit could reach a browser that already had one.
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, no-cache";
    }
}
